# voices.yaml — per-language TTS voice IDs (one voice per language; CLAUDE.md §7).
#
# The agent always replies in the patient's language with a language-matched voice.
# POC covers en + hi + mr. (Marathi STT/TTS work via Sarvam mr-IN; only the semantic
# turn detector lacks Marathi, so mr sessions use VAD endpointing — see registry.py.)
#
# NOTE: Sarvam Bulbul speaker IDs can change between model versions. Verify the exact
# speaker names against `sarvam.TTS` / the Sarvam docs at build time (Risk R5). Bulbul
# voices are multilingual across Indic languages, so one speaker serves en/hi/mr. The
# registry passes voices[language] into the TTS wrapper; an unknown language falls back
# to `default`.

provider: sarvam
model: "bulbul:v2"

# The agent persona is "Dhara", a FEMALE assistant. "anushka" is a female Bulbul v2 speaker and
# is multilingual across Indic languages + English, so one female voice serves en/hi/mr.
# (Other female v2 options: manisha, vidya, arya.) Verify speaker names against the Sarvam docs.
voices:
  en:
    speaker: "anushka"      # Dhara — female
  hi:
    speaker: "anushka"      # Dhara — female
  mr:
    speaker: "anushka"      # Dhara — female

default:
  speaker: "anushka"        # Dhara — female
