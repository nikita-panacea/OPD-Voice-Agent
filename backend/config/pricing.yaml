# pricing.yaml — dated unit prices per provider/model.
#
# WHY DATA-DRIVEN: cost math (telemetry/cost.py) reads this file so updating a price
# never touches code, and every historical session can be re-costed against the price
# set that was live at the time. Each entry carries `as_of` + `source` for auditability.
#
# ALL PRICES IN USD. Verified 2026-06-14 via web search (see docs/DECISIONS.md).
# Units:
#   stt  -> usd_per_second        (audio seconds processed)
#   llm  -> usd_per_1m_input / usd_per_1m_output / usd_per_1m_cached_input  (tokens)
#          (cached input = prompt-cache hits; see telemetry/cost.py. Omit/null -> billed at
#           full input price.)
#   tts  -> usd_per_character
#
# Treat these as starting defaults; re-verify before any real cost comparison (CLAUDE.md §15).

version: 1
currency: USD

stt:
  # Sarvam Saaras v3 — POC default STT.
  "sarvam/saaras:v3":
    usd_per_second: 0.000092        # ~ ₹30/hr
    as_of: "2026-06-14"
    source: "https://www.sarvam.ai/api-pricing"
  # Deepgram Nova-3 (global_stack / low_cost / global_quality). Multilingual tier.
  "deepgram/nova-3":
    usd_per_second: 0.0001533       # $0.0092/min (drift: CLAUDE.md said ~$0.0077/min)
    as_of: "2026-06-14"
    source: "https://deepgram.com/pricing"
  # OpenAI transcription (whisper_eval pipeline / eval baseline).
  "openai/gpt-4o-mini-transcribe":
    usd_per_second: 0.00005         # $0.003/min
    as_of: "2026-06-14"
    source: "OpenAI 2026 transcription pricing"
  "openai/gpt-4o-transcribe":
    usd_per_second: 0.0001          # $0.006/min
    as_of: "2026-06-14"
    source: "OpenAI 2026 transcription pricing"
  "openai/whisper-1":
    usd_per_second: 0.0001          # $0.006/min (batch-oriented eval baseline)
    as_of: "2026-06-14"
    source: "OpenAI 2026 Whisper pricing"

llm:
  # OpenAI GPT-4.1 — POC default intake brain (best tool-calling for save_intake_field).
  # OpenAI cached input = 0.25x input (prompt caching, ~75% off). Verified 2026-06-15.
  "openai/gpt-4.1":
    usd_per_1m_input: 2.00
    usd_per_1m_output: 8.00
    usd_per_1m_cached_input: 0.50
    as_of: "2026-06-14"
    source: "OpenAI 2026 pricing trackers (cloudzero, costbench)"
  "openai/gpt-4.1-mini":
    usd_per_1m_input: 0.40
    usd_per_1m_output: 1.60
    usd_per_1m_cached_input: 0.10
    as_of: "2026-06-14"
    source: "OpenAI 2026 pricing trackers"
  "openai/gpt-4.1-nano":
    usd_per_1m_input: 0.10
    usd_per_1m_output: 0.40
    usd_per_1m_cached_input: 0.025
    as_of: "2026-06-14"
    source: "OpenAI 2026 pricing trackers"
  # Gemini (config-swap alternative brain). Cached input = 0.10x input (cache read, ~90% off).
  "google/gemini-2.5-flash":
    usd_per_1m_input: 0.30
    usd_per_1m_output: 2.50
    usd_per_1m_cached_input: 0.03
    as_of: "2026-06-14"
    source: "https://ai.google.dev/gemini-api/docs/pricing"
  "google/gemini-2.5-flash-lite":
    usd_per_1m_input: 0.10
    usd_per_1m_output: 0.40
    usd_per_1m_cached_input: 0.01
    as_of: "2026-06-14"
    source: "https://ai.google.dev/gemini-api/docs/pricing"
  # Sarvam LLM — price not confirmed at plan time (TODO: verify before use; not on POC path).
  "sarvam/sarvam-30b":
    usd_per_1m_input: 0.026
    usd_per_1m_output: 0.11
    usd_per_1m_cached_input: 0.016
    as_of: "2026-06-14"
    source: "TODO: verify on https://www.sarvam.ai/api-pricing"

# LiveKit Cloud transport — billed per minute (agent session minutes + human participant
# minutes). These are Build/PAYG rates verified 2026-06-15; Scale tier is ~15-25% lower and is
# required for HIPAA. Cost = minutes * (agent_minute + human_participants * participant_minute).
livekit:
  "livekit/cloud":
    usd_per_agent_minute: 0.01
    usd_per_participant_minute: 0.0004
    as_of: "2026-06-15"
    source: "https://livekit.com/pricing (Build/PAYG)"

tts:
  # Sarvam Bulbul — POC default TTS.
  "sarvam/bulbul:v2":
    usd_per_character: 0.0000165     # ~ ₹15 / 10K chars
    as_of: "2026-06-14"
    source: "https://www.sarvam.ai/api-pricing"
  # ElevenLabs Flash v2.5 (global_stack / global_quality). Flash = 0.5 credits/char;
  # credit->USD is plan-dependent. ~$0.05-0.12 per 1000 chars across plans/resellers.
  # ESTIMATE below ($0.06/1000 chars); replace with your plan's exact $/char before costing.
  "elevenlabs/flash-v2.5":
    usd_per_character: 0.00006      # ESTIMATE: ~$0.06 / 1000 chars (plan-dependent)
    credits_per_character: 0.5
    as_of: "2026-06-14"
    source: "ElevenLabs 2026 pricing pages (Flash ~$0.05-0.12/1K chars)"
