# pipelines.yaml — named STT/LLM/TTS triples ("a pipeline is a named triple").
#
# Switching pipelines is a CONFIG change, not a code change (CLAUDE.md §6). Each stage names a
# provider (matches a builder in providers/registry.py) + a model + options. The `pricing_key`
# on each stage maps to an entry in pricing.yaml for cost attribution.
#
# To run a different pipeline live: set ACTIVE_PIPELINE in .env (e.g. ACTIVE_PIPELINE=low_cost),
# restart the agent worker, run a session. Telemetry rows are tagged with the pipeline, so
# `telemetry/compare.py` (and GET /api/compare) can compare cost vs latency/completion across
# pipelines from real sessions.

active_default: indic_quality

pipelines:
  # ---- Best Indic + code-mix quality (POC default) ------------------------------
  indic_quality:
    description: "Sarvam Saaras v3 STT -> GPT-4.1-mini -> Sarvam Bulbul TTS"
    stt:
      provider: sarvam
      model: "saaras:v3"
      pricing_key: "sarvam/saaras:v3"
      options: { mode: "transcribe" }
    llm:
      provider: openai
      model: "gpt-4.1-mini"
      pricing_key: "openai/gpt-4.1-mini"
      options: {}
    tts:
      provider: sarvam
      model: "bulbul:v2"
      pricing_key: "sarvam/bulbul:v2"
      options: {}

  # ---- Global stack: Deepgram + GPT-4.1 + ElevenLabs ----------------------------
  global_stack:
    description: "Deepgram Nova-3 -> GPT-4.1 -> ElevenLabs Flash v2.5"
    stt:
      provider: deepgram
      model: "nova-3"
      pricing_key: "deepgram/nova-3"
      options: {}                 # set options.language: "multi" for code-switch
    llm:
      provider: openai
      model: "gpt-4.1"
      pricing_key: "openai/gpt-4.1"
      options: {}
    tts:
      provider: elevenlabs
      model: "eleven_flash_v2_5"
      pricing_key: "elevenlabs/flash-v2.5"
      options: {}

  # ---- Low cost: Deepgram + Gemini Flash-Lite + Sarvam Bulbul --------------------
  low_cost:
    description: "Deepgram Nova-3 -> Gemini 2.5 Flash-Lite -> Sarvam Bulbul"
    stt:
      provider: deepgram
      model: "nova-3"
      pricing_key: "deepgram/nova-3"
      options: {}
    llm:
      provider: google
      model: "gemini-2.5-flash-lite"
      pricing_key: "google/gemini-2.5-flash-lite"
      options: {}
    tts:
      provider: sarvam
      model: "bulbul:v2"
      pricing_key: "sarvam/bulbul:v2"
      options: {}

  # ---- Translate bridge: Saaras translate -> English LLM -> Bulbul (strategy flag) -
  translate_bridge:
    description: "Sarvam Saaras v3 (mode=translate -> English) -> GPT-4.1-mini -> Sarvam Bulbul"
    stt:
      provider: sarvam
      model: "saaras:v3"
      pricing_key: "sarvam/saaras:v3"
      options: { mode: "translate" }
    llm:
      provider: openai
      model: "gpt-4.1-mini"
      pricing_key: "openai/gpt-4.1-mini"
      options: {}
    tts:
      provider: sarvam
      model: "bulbul:v2"
      pricing_key: "sarvam/bulbul:v2"
      options: {}

  # ---- Global quality: Deepgram + Gemini 2.5 Flash + ElevenLabs -----------------
  global_quality:
    description: "Deepgram Nova-3 -> Gemini 2.5 Flash -> ElevenLabs Flash v2.5"
    stt:
      provider: deepgram
      model: "nova-3"
      pricing_key: "deepgram/nova-3"
      options: {}
    llm:
      provider: google
      model: "gemini-2.5-flash"
      pricing_key: "google/gemini-2.5-flash"
      options: {}
    tts:
      provider: elevenlabs
      model: "eleven_flash_v2_5"
      pricing_key: "elevenlabs/flash-v2.5"
      options: {}

  # ---- Whisper eval baseline: OpenAI STT -> GPT-4.1-mini -> Sarvam Bulbul --------
  # whisper-1 is batch-oriented (eval baseline); gpt-4o-mini-transcribe streams for live use.
  whisper_eval:
    description: "OpenAI transcribe -> GPT-4.1-mini -> Sarvam Bulbul (eval baseline)"
    stt:
      provider: whisper
      model: "gpt-4o-mini-transcribe"
      pricing_key: "openai/gpt-4o-mini-transcribe"
      options: {}
    llm:
      provider: openai
      model: "gpt-4.1-mini"
      pricing_key: "openai/gpt-4.1-mini"
      options: {}
    tts:
      provider: sarvam
      model: "bulbul:v2"
      pricing_key: "sarvam/bulbul:v2"
      options: {}

  # ---- Whisper STT + Sarvam TTS, one per LLM (the cost-comparison combos) --------
  # whisper-1 is batch-oriented; swap STT model to gpt-4o-mini-transcribe for live streaming.
  whisper_sarvam_nano:
    description: "Whisper STT -> GPT-4.1-nano -> Sarvam Bulbul"
    stt:
      provider: whisper
      model: "whisper-1"
      pricing_key: "openai/whisper-1"
      options: {}
    llm:
      provider: openai
      model: "gpt-4.1-nano"
      pricing_key: "openai/gpt-4.1-nano"
      options: {}
    tts:
      provider: sarvam
      model: "bulbul:v2"
      pricing_key: "sarvam/bulbul:v2"
      options: {}

  whisper_sarvam_mini:
    description: "Whisper STT -> GPT-4.1-mini -> Sarvam Bulbul"
    stt:
      provider: whisper
      model: "whisper-1"
      pricing_key: "openai/whisper-1"
      options: {}
    llm:
      provider: openai
      model: "gpt-4.1-mini"
      pricing_key: "openai/gpt-4.1-mini"
      options: {}
    tts:
      provider: sarvam
      model: "bulbul:v2"
      pricing_key: "sarvam/bulbul:v2"
      options: {}

  whisper_sarvam_gemini:
    description: "Whisper STT -> Gemini 2.5 Flash -> Sarvam Bulbul"
    stt:
      provider: whisper
      model: "whisper-1"
      pricing_key: "openai/whisper-1"
      options: {}
    llm:
      provider: google
      model: "gemini-2.5-flash"
      pricing_key: "google/gemini-2.5-flash"
      options: {}
    tts:
      provider: sarvam
      model: "bulbul:v2"
      pricing_key: "sarvam/bulbul:v2"
      options: {}
