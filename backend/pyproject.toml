[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opd-intelligence-backend"
version = "0.1.0"
description = "Voice-to-voice OPD patient intake agent (POC) — LiveKit cascade pipeline"
requires-python = ">=3.11"
dependencies = [
    # LiveKit Agents 1.6.x (verified 2026-06-14: latest 1.6.0, released 2026-06-11).
    # Use ~=1.6 (CLAUDE.md said ~=1.0 — that is stale).
    "livekit-agents[silero,turn-detector]~=1.6",
    # Pipeline plugins for the provider/cost comparison (Sarvam, OpenAI, Deepgram,
    # ElevenLabs, Google/Gemini) + Krisp noise cancellation.
    "livekit-plugins-sarvam",
    "livekit-plugins-openai",
    "livekit-plugins-deepgram",
    "livekit-plugins-elevenlabs",
    "livekit-plugins-google",
    "livekit-plugins-noise-cancellation",
    "livekit-api",          # LiveKit access-token minting for the browser client
    # API + config + storage
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2",
    "pydantic-settings>=2",
    "structlog",
    "pyyaml",
    "python-dotenv",
    "sqlalchemy>=2",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "black",
]

[tool.setuptools]
# Flat layout: backend/ is the import root. List packages explicitly so editable installs
# don't trip setuptools auto-discovery (multiple top-level packages).
packages = ["config", "agent", "intake", "providers", "telemetry", "store", "api"]
py-modules = ["logging_setup"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Bilingual prompt strings are intentionally long natural-language literals.
"intake/questions.py" = ["E501"]
# Hindi prompt strings in the prompt builder are likewise long literals.
"agent/prompts.py" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
